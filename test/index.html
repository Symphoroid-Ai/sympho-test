<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Web">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>Pocket Web</title>
</head>
<body>
<header class="app-header">
  <h1>Pocket Web</h1>
  <button id="pocketButton" class="button accent" type="button">ポケットモード</button>
</header>
<main class="app-main">
  <form id="urlForm" class="url-form">
    <label for="urlInput">URL</label>
    <div class="url-row">
      <input id="urlInput" type="url" inputmode="url" placeholder="https://example.com" autocomplete="url" required>
      <button class="button" type="submit">表示</button>
    </div>
    <p class="hint">YouTube URLは動画プレイヤーとして表示します。</p>
  </form>
  <section class="viewer">
    <div id="emptyState" class="state">URLを入力して「表示」を押してください。</div>
    <iframe id="webFrame" title="Web content" hidden
      referrerpolicy="strict-origin-when-cross-origin"
      allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
      allowfullscreen></iframe>
    <div id="youtubePlayer" class="youtube-player" hidden></div>
    <div id="errorState" class="state error" hidden></div>
  </section>
</main>
<div id="lockOverlay" class="lock-overlay" hidden aria-hidden="true">
  <div class="lock-panel">
    <div class="lock-icon">🔒</div>
    <strong>ポケットモード</strong>
    <p>タッチ操作をロックしています</p>
    <div class="progress"><span id="unlockProgress"></span></div>
    <small>2秒間長押しで解除</small>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
